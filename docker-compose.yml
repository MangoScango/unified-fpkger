# On-demand job (builds, then exits) — use `docker compose run`, passing
# build-fpkg.sh args after the service name:
#
#   docker compose run --rm fpkger --out /work/out /work/CUSA28863-app
#   docker compose run --rm fpkger --no-dlc --out /work/out /work/CUSA13632-app
services:
  fpkger:
    build:
      context: .
    image: unified-fpkger
    # Make sure your workdir has enough space for 2x the game you want to dump/pack
    # SSD is preferable if you can afford it
    working_dir: /work
    environment:
      # For Unraid. 99:100 = nobody:users
      PUID: 99
      PGID: 100
    volumes:
      -/mnt/user/cache:/work
      -/mnt/user/ps4dumps:/ps4dumps
