# Web UI, left running:
#
#   docker compose -f docker/docker-compose.yml up -d
#   then open http://<server>:8080/
#
# One-off terminal jobs still work, with build-pkg.py args after the service:
#
#   docker compose -f docker/docker-compose.yml run --rm fpkger --out /work/out /work/CUSA28863-app
services:
  fpkger:
    image: ghcr.io/mangoscango/unified-fpkger:latest
    command: web
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Make sure your workdir has enough space for 2x the game you want to dump/pack
    # SSD is preferable if you can afford it
    working_dir: /work
    env_file:
      - path: ../.env
        required: false
    environment:
      # For Unraid. 99:100 = nobody:users
      PUID: 99
      PGID: 100
      # The UI can only browse and write under these, colon-separated.
      WEB_ROOTS: /work:/ps4dumps
      # Default firmware libraries folder for the Backport tab
      # Must be under one of the WEB_ROOTS above.
      # PS5BACKPORT_LIBS: /work/PS5_Libs
      # Without it, anyone who can reach the port can run dumps and builds.
      # WEB_PASSWORD: change-me
    volumes:
      - /mnt/user/cache:/work
      - /mnt/user/ps4dumps:/ps4dumps
