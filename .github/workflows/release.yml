name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in the artifact name"
        required: true
        default: dev

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Stage release
        run: python release/build.py --version "$VERSION" --output dist

      - name: Verify staged release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          root = Path("dist") / f"unified-fpkger-{os.environ['VERSION']}"
          assert root.is_dir()
          assert os.access(root / "RUN.sh", os.X_OK)

          orbis = root / "PS4_Fake_PKG_Tools_3" / "orbis-pub-cmd.exe"
          with orbis.open("rb") as handle:
              handle.seek(0x3681B)
              assert handle.read(2) == b"\xEB\x07"

          subprocess.run(
              [sys.executable, str(root / "tools" / "sfo.py"), "--version"],
              check=True,
          )
          sys.path.insert(0, str(root))
          from ps_pkg_info import pkg  # noqa: F401
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: unified-fpkger-${{ env.VERSION }}
          path: dist/unified-fpkger-${{ env.VERSION }}
          include-hidden-files: true
          overwrite: true
          retention-days: 30
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          # GitHub artifacts cannot be attached to a release directly, so the
          # staged directory is zipped here as the release asset.
          zip -qr "unified-fpkger-$VERSION.zip" "unified-fpkger-$VERSION"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "unified-fpkger-$VERSION.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "unified-fpkger-$VERSION.zip" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
